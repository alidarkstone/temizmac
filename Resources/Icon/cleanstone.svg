<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.6" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1026" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  </g>
  <!-- çakıl taşı -->
  <g filter="url(#shadow)" transform="rotate(-12 500 560)">
    <path d="M300 600 C 290 470, 400 395, 520 400 C 650 405, 735 470, 730 580
             C 725 690, 620 745, 505 742 C 380 738, 308 700, 300 600 Z" fill="url(#stone)"/>
    <path d="M300 600 C 290 470, 400 395, 520 400 C 650 405, 735 470, 730 580
             C 725 690, 620 745, 505 742 C 380 738, 308 700, 300 600 Z" fill="url(#shine)"/>
  </g>
  <!-- parıltılar -->
  <path d="M700 230 C 712 300, 728 316, 798 328 C 728 340, 712 356, 700 426
           C 688 356, 672 340, 602 328 C 672 316, 688 300, 700 230 Z" fill="#FFFFFF"/>
  <path d="M800 420 C 806 452, 814 460, 846 466 C 814 472, 806 480, 800 512
           C 794 480, 786 472, 754 466 C 786 460, 794 452, 800 420 Z" fill="#FDE68A"/>
  <circle cx="610" cy="215" r="14" fill="#ffffff" opacity="0.8"/>
</svg>
