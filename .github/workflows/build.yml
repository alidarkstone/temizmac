name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Cleanstone.app Cleanstone.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Cleanstone
          path: build/Cleanstone.zip
