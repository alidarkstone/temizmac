name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Cleanstone.app Cleanstone.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Cleanstone
          path: build/Cleanstone.zip
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Cleanstone.zip \
            --title "Cleanstone $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
