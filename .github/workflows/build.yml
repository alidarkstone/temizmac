name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent Cleanstone.app Cleanstone.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Cleanstone
          path: build/Cleanstone.zip
      - name: GitHub Release (Info.plist sürümü yeniyse)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" build/Cleanstone.zip --clobber && gh release edit "v$V" --notes-file RELEASE_NOTES.md
          else
            gh release create "v$V" build/Cleanstone.zip --target "$GITHUB_SHA" \
              --title "Cleanstone v$V" --notes-file RELEASE_NOTES.md
          fi
