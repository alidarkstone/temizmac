name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent TemizMac.app TemizMac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TemizMac
          path: build/TemizMac.zip
